<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cineteca | Cartelera</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="encabezado">
    <div class="marca">
      <img src="img/cine.png" alt="Cineteca" width="24">
      <span class="marca_nombre">Cineteca</span>
    </div>
    <button class="boton_filtro" type="button">
      <img src="img/filtro.png" alt="Filtrar" width="22">
    </button>
  </header>

  <main class="principal">
    <p class="fecha">Lunes 15 de junio</p>
    <h1 class="titulo_pagina">En cartelera</h1>

    <a href="detalle.html" class="destacada">
      <span class="destacada_etiqueta">Estreno</span>
      <h2 class="destacada_titulo">Marea negra</h2>
      <p class="destacada_datos">Drama · 2h 04 · 18:30 / 21:00</p>
    </a>

    <section class="tambien">
      <h2 class="titulo_seccion">También en sala</h2>

      <div class="grilla">

        <a href="detalle.html" class="tarjeta">
          <img src="img/el-faro.jpg" alt="El faro" class="tarjeta_poster">
          <h3 class="tarjeta_titulo">El faro</h3>
          <p class="tarjeta_datos">Misterio · 1h 49</p>
        </a>

        <a href="detalle.html" class="tarjeta">
          <img src="img/noche-en-vela.jpg" alt="Noche en vela" class="tarjeta_poster">
          <h3 class="tarjeta_titulo">Noche en vela</h3>
          <p class="tarjeta_datos">Drama · 1h 58</p>
        </a>

        <a href="detalle.html" class="tarjeta">
          <img src="img/cielo-abierto.jpg" alt="Cielo abierto" class="tarjeta_poster">
          <h3 class="tarjeta_titulo">Cielo abierto</h3>
          <p class="tarjeta_datos">Aventura · 2h 11</p>
        </a>

        <a href="detalle.html" class="tarjeta">
          <img src="img/el-ultimo-tren.jpg" alt="El último tren" class="tarjeta_poster">
          <h3 class="tarjeta_titulo">El último tren</h3>
          <p class="tarjeta_datos">Suspenso · 1h 42</p>
        </a>

      </div>
    </section>
  </main>

  <nav class="barra_inferior">
    <a href="index.html" class="opcion opcion_activa">
      <img src="img/cine.png" alt="" width="22">
      <span>Cartelera</span>
    </a>
    <a href="#" class="opcion">
      <img src="img/buscar.png" alt="" width="22">
      <span>Buscar</span>
    </a>
    <a href="#" class="opcion">
      <img src="img/perfil.png" alt="" width="22">
      <span>Perfil</span>
    </a>
  </nav>

</body>
</html>
