<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cineteca | Confirmación</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <div class="confirmacion">
    <div class="check">✓</div>
    <h1 class="gracias" id="gracias">¡Gracias por tu compra!</h1>
    <p class="sub_gracias">Tu entrada está confirmada</p>

    <div class="ticket">
      <div class="ticket_titulo" id="t_pelicula">—</div>
      <div class="linea_pedido"><span>Función</span><span id="t_funcion">—</span></div>
      <div class="linea_pedido"><span>Asientos</span><span id="t_asientos">—</span></div>
      <div class="linea_pedido linea_total"><span>Total</span><span id="t_total">—</span></div>
    </div>

    <a href="index.html" class="boton_continuar">Volver al inicio</a>
  </div>

  <script src="js/confirmacion.js"></script>
</body>
</html>
